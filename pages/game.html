<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    

    <title>Quiz Time</title>
</head>

<body class="bg-gradient-to-b from-pink-500 to-purple-300 min-h-screen flex items-center justify-center p-5">

    <div class="w-full max-w-4xl">

        <div class="flex items-center justify-between mb-6">



            <a href="../index.html"
   class="bg-pink-500 hover:bg-pink-700 text-white font-bold py-3 px-6 rounded-xl">
    Home
</a>

            <div class="w-2/3">
                <div class="flex justify-between text-white font-bold mb-2">
                    <span id="question-number">Question 1 of 10</span>
                    <span id="questions-left">9 Questions left</span>
                </div>

                <div class="w-full bg-white/30 rounded-full h-3">
                    <div id="progress"
                        class="bg-white h-3 rounded-full transition-all duration-300"
                        style="width: 10%;">
                    </div>
                </div>
            </div>

            <div class="bg-pink-300/40 text-white px-5 py-3 rounded-xl text-center">
                <p class="text-sm">Score</p>
                <p id="score" class="text-2xl font-bold">0</p>
            </div>

        </div>


        <div class="bg-pink-50 rounded-3xl p-8 md:p-12 shadow-xl">

            <h2 id="question"
                class="text-2xl md:text-4xl font-bold text-gray-800 text-center mb-8">
                Question
            </h2>


            <div id="answers" class="grid grid-cols-1 md:grid-cols-2 gap-5">

            </div>


            <div class="flex justify-between mt-10">

                <button id="back"
                    class="bg-pink-500 hover:bg-pink-700 text-white font-bold px-7 py-3 rounded-xl">
                    ← Back
                </button>

                <button id="next"
                    class="bg-purple-500 hover:bg-purple-700 text-white font-bold px-7 py-3 rounded-xl">
                    Next →
                </button>

            </div>

        </div>

    </div>


    <script src="../script.js"></script>

</body>

</html>
